      <script>
        const INSTRUKCJE = ["", "add", "div", "halt", "jgtz", "jump", "jzero", "load", "mult", "read", "store", "sub", "write"],
        LICZBA_REJESTROW = 16,
        LIMIT_KROKOW = 10000;
        KLUCZ_ZAPISU = "ram-machine-zapis",
        CZAS_ANIMACJI = 1200,
        $ = (selector, root = document) => root.querySelector(selector),
        $$ = (selector, root = document) => [...root.querySelectorAll(selector)],
        pustaPamiec = () => Array(LICZBA_REJESTROW).fill(null);
        let pc = 0, inputHead = 0, output = [], memory = pustaPamiec(), running = false, animating = false;
            const tbody = document.getElementById("program-body");

          function usunWiersz() {
            const tbody = document.getElementById("program-body");

            if (tbody.rows.length > 1) {
              tbody.deleteRow(tbody.rows.length - 1);
            } else {
              const row = tbody.rows[0];
              row.cells[1].innerText = "";

              row.cells[4].innerText = "";

          }

                  document.addEventListener("click", function(e) {
            const row = e.target.closest("tr");

            if (!row) return;
 
            
            if (row.classList.contains("aktywny")) {
              row.classList.remove("aktywny");
            } else {
             
              const rows = document.querySelectorAll("#program-body tr");
              rows.forEach(r => r.classList.remove("aktywny"));

              
              row.classList.add("aktywny");
            }
          });
          function przygotujZapis() {
            return {
              version: 1,
              savedAt: newDate().toISOString(),
              pc,
              inputHead,
              output,
              memory,
              input: pobierzTasmeWejsciowa(),
              program: pobierzWierszeProgramu()
            };
          }
 HEAD

          function utworzSelect(wartosc = ""){
            const select = document.createElement("select");
            INSTRUKCJE.forEach(instr => {
                select.add(new Option(instr, instr));
            });
            select.value = wartosc;
            return select;
          }

          function dodajWiersz(dane = {}) {
            const row = $("#program-body").insertRow();
            row.innerHTML = `
            <td class="ln"></td>
            <td contenteditable="true"></td>
            <td></td>
            <td contenteditable="true"></td>
            <td contenteditable="true"></td>
             `;
            row.cells[1].innerText = dane.label || "";
            row.cells[2].appendChild(utworzSelect(dane.instuction || ""));
            row.cells[3].innerText = dane.argument || "";
            row.cells[4].innerText = dane.comment || "";
            odswiezNumerWierszy();
            render();
          }

            $$("#program-body tr").forEach((row, index) => {
              row.cells[0].innerText = `${index + 1}.`;
            });
          }

          function usunWiersz() {
            const tbody = $("#program-body");
            if (tbody.rows.length > 1) {
                tbody.deleteRow(tbody.rows.length - 1);
            } else {
                const row = tbody.rows[0];
                row.cells[1].innerText = "";
                row.cells[2].querySelector("select").value = "";
                row.cells[3].innerText = "";
                row.cells[4].innerText = "";
            }
            odswiezNumerWierszy();
            render();
          }

          function odswiezNumerWierszy() {
            $$("$program-body tr").forEach((row, index) => {
                row.cells[0].innerText = `${index + 1}.`;
            });
          }

          async function zapiszMaszyne() {
       const zapis = przygotujZapis();
       const tekstZapisu = JSON.stringify(zapis, null, 2);
       zapiszWLokalnejPamieci(zapis);
       if (window.showSaveFilePicker) {
         try {
           const handle = await window.showSaveFilePicker({
             suggestedName: "ram-machine-zapis.json",
              types: [
                {
                 description: "Plik zapisu RAM Machine",
                  accept: { "application/json": [".json"] }
               }
              ]
           });
           const writable = await handle.createWritable();
            await writable.write(tekstZapisu);
            await writable.close();
          ustawStatus("Zapisano dane maszyny we wskazanym miejscu.");
           return;
          } catch (error) {
           if (error.name === "AbortError") {
              ustawStatus("Anulowano wybĂłr miejsca zapisu.");
            return;
           }
            ustawStatus("Nie udało się wybrał miejsca zapisu. Użyto zwykłego pobierania pliku.");
         }
       }
        pobierzPlikZapisu(tekstZapisu);
        ustawStatus("Zapisano dane maszyny do pliku pobranego przez przeglądarka.");
     }
      function pobierzPlikZapisu(tekstZapisu) {
        const blob = new Blob([tekstZapisu], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
      link.href = url;
        link.download = "ram-machine-zapis.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
       setTimeout(() => URL.revokeObjectURL(url), 1000);
     }
      function wczytajMaszyne() {
        const input = $("#plik-zapisu");
        input.value = "";
       input.click();
      }
    function obsluzPlikZapisu(event) {
        const file = event.target.files[0];
      if (!file) {
          wczytajMaszyneZPrzegladarki();
         return;
       }
      const reader = new FileReader();
      reader.onload = () => {
          try {
           const zapis = JSON.parse(reader.result);
            zastosujZapis(zapis);
           zapiszWLokalnejPamieci(zapis);
           ustawStatus("Wczytano dane maszyny z pliku.");
        } catch (error) {
           ustawStatus(`Nie udało się wczytaÄ‡ pliku: ${error.message}`);
         }
       };
       reader.onerror = () => {
          ustawStatus("Nie udało się odczytać wybranego pliku.");
      };
       reader.readAsText(file);
      }
      function wczytajMaszyneZPrzegladarki() {
        const raw = pobierzZLokalnejPamieci();
        if (!raw) {
         ustawStatus("Brak zapisanych danych maszyny.");
          return;
       }
        try {
         const zapis = JSON.parse(raw);
         zastosujZapis(zapis);
          ustawStatus("Wczytano zapisane dane maszyny.");
        } catch (error) {
         ustawStatus(`Nie udało się wczytać zapisu: ${error.message}`);
        }
     }
      function zapiszWLokalnejPamieci(zapis) {
        try {
          localStorage.setItem(KLUCZ_ZAPISU, JSON.stringify(zapis));
       } catch (error) {
        console.warn("Nie udało się zapisać w localStorage.", error);
       }
    }
    function pobierzZLokalnejPamieci() {
        try {
        return localStorage.getItem(KLUCZ_ZAPISU);
        } catch (error) {
          console.warn("Nie udaLo się odczytać z localStorage.", error);
         return null;
       }
    }
    function wyczyscProgram() {
            const tbody = $("#program-body");
            tbody.innerHTML ="";
            dodajWiersz();
          }
          function komorkaPameci(index){
            const row = $$("#memory-body tr")[index];
            if (!row) return null;
            row.scrollIntoView({block: "nearest"});
            return row.cells[1];
          }
          function komorkaWejscia(index){
            return $$("#input-cells .komorka")[index] || null;
          }
          function wolnaKomorkaWyjscia(){
            return $("#output-cells .komorka.head") || $("#output-cells .komorka:last-child");
          }
          function elementDlaArgumentu(argument) {
            if (!argument) return komorkaPamieci(0);
            if (argument.startsWith("=")) return $("#argument-view");
            return komorkaPamieci(adres(argument));
          }
          async function animujOperacje(cmd,znak, operand){
            const accumulator = wymaganaWartoscRejestru(0,cmd.instruction);
            await animujPrzeplyw({
              from: elementDlaArgumentu(cmd.argument),
              to: komorkaPameci(0),
              value: operand,
              label: `${accumulator} ${znak} ${operand}`
            });
          }
           async function animujPrzeplyw({ from, to, value, label }) {
      if (!from || !to) return;
      animating = true;
      const layer = $("#animation-layer");
      const token = document.createElement("div");
      token.className = "animowana-wartosc";
      token.innerHTML = `<strong>${value}</strong><span>${label || ""}</span>`;
      layer.appendChild(token);
      const fromRect = from.getBoundingClientRect();
      const toRect = to.getBoundingClientRect();
      const startX = fromRect.left + fromRect.width / 2;
      const startY = fromRect.top + fromRect.height / 2;
      const endX = toRect.left + toRect.width / 2;
      const endY = toRect.top + toRect.height / 2;
      from.classList.add("animacja-zrodlo");
      to.classList.add("animacja-cel");
      token.style.left = `${startX}px`;
      token.style.top = `${startY}px`;
      try {
        if (token.animate) {
          await token.animate(
            [
              { left: `${startX}px`, top: `${startY}px`, transform: "translate(-50%, -50%) scale(0.9)", opacity: 0.25 },
              { left: `${(startX + endX) / 2}px`, top: `${Math.min(startY, endY) - 28}px`, transform: "translate(-50%, -80%) scale(1.08)", opacity: 1, offset: 0.45 },
              { left: `${endX}px`, top: `${endY}px`, transform: "translate(-50%, -50%) scale(1)", opacity: 1 }
            ],
            {
              duration: CZAS_ANIMACJI,
              easing: "cubic-bezier(.2,.7,.2,1)",
              fill: "forwards"
            }
          ).finished;
        } else {
          await new Promise(resolve => setTimeout(resolve, CZAS_ANIMACJI));
          token.style.left = `${endX}px`;
          token.style.top = `${endY}px`;
        }
      } catch (error) {
        token.style.left = `${endX}px`;
        token.style.top = `${endY}px`;
      }
      token.classList.add("animacja-koniec");
      await new Promise(resolve => setTimeout(resolve, 120));
      token.remove();
      from.classList.remove("animacja-zrodlo");
      to.classList.remove("animacja-cel");
      animating = false;
    }


    async function wykonajKrok() {
  if (animating) return false;
  if (!running) running = true;

  const { program, labels } = pobierzProgram();

  if (pc < 0 || pc >= program.length) {
    running = false;
    ustawStatus("Program zakończony: PC poza zakresem programu.");
    render(program);
    return false;
  }

  const cmd = program[pc];
  let nextPc = pc + 1;

  try {
    switch (cmd.instruction) {
      case "read": {
        const target = wolnyRejestr();
        const value = wartoscZTasmy(cmd.argument);

        await animujPrzeplyw({
          from: komorkaWejscia(normalizujLiczbe(cmd.argument) - 1),
          to: komorkaPamieci(target),
          value,
          label: `READ -> R${target}`
        });

        memory[target] = value;
        break;
      }

      case "write": {
        const sourceArgument = cmd.argument || "0";
        const value = wartosc(sourceArgument);

        await animujPrzeplyw({
          from: elementDlaArgumentu(sourceArgument),
          to: wolnaKomorkaWyjscia(),
          value,
          label: `WRITE ${value}`
        });

        output.push(value);
        break;
      }

      case "load":
        await animujPrzeplyw({
          from: elementDlaArgumentu(cmd.argument),
          to: komorkaPamieci(0),
          value: wartosc(cmd.argument),
          label: "LOAD -> R0"
        });

        memory[0] = wartosc(cmd.argument);
        break;

      case "store": {
        const target = adres(cmd.argument);
        const value = wymaganaWartoscRejestru(0, cmd.instruction);

        await animujPrzeplyw({
          from: komorkaPamieci(0),
          to: komorkaPamieci(target),
          value,
          label: `STORE -> R${target}`
        });

        memory[target] = value;
      }
      break;

      case "add":
        await wykonajArytmetyke(cmd, "+", (a, b) => a + b);
        break;

      case "sub":
        await wykonajArytmetyke(cmd, "-", (a, b) => a - b);
        break;

      case "mult":
        await animujOperacje(cmd, "×", wartosc(cmd.argument));
        memory[0] =
          wymaganaWartoscRejestru(0, cmd.instruction) *
          wartosc(cmd.argument);
        break;

      case "div": {
        const divisor = wartosc(cmd.argument);

        if (divisor === 0) {
          throw new Error("Dzielenie przez zero.");
        }

        await animujOperacje(cmd, "÷", divisor);

        memory[0] = Math.trunc(
          wymaganaWartoscRejestru(0, cmd.instruction) / divisor
        );

        break;
      }

      case "jump":
        nextPc = celSkoku(cmd.argument, labels);
        break;

      case "jzero":
        if (wymaganaWartoscRejestru(0, cmd.instruction) === 0) {
          nextPc = celSkoku(cmd.argument, labels);
        }
        break;

      case "jgtz":
        if (wymaganaWartoscRejestru(0, cmd.instruction) > 0) {
          nextPc = celSkoku(cmd.argument, labels);
        }
        break;

      case "halt":
        running = false;
        pc = nextPc;

        ustawStatus("Program zatrzymany instrukcją HALT.");
        render(program);

        return false;

      default:
        throw new Error(`Nieznana instrukcja: ${cmd.instruction}.`);
    }

    pc = nextPc;

    ustawStatus(
      `Wykonano: ${cmd.instruction.toUpperCase()} ${cmd.argument}`
    );

    render(program);

    return true;

  } catch (error) {
    running = false;

    ustawStatus(
      `Błąd w linii ${cmd.line + 1}: ${error.message}`
    );

    render(program);

    return false;
  }
}

async function uruchomProgram() {
  if (animating) return;

  running = true;
  let steps = 0;

  while (
    running &&
    steps < LIMIT_KROKOW &&
    (await wykonajKrok())
  ) {
    steps++;
  }

  if (steps >= LIMIT_KROKOW) {
    running = false;

    ustawStatus(
      `Przerwano po ${LIMIT_KROKOW} krokach. Możliwa pętla nieskończona.`
    );
  }

  render();
}

function zatrzymajProgram() {
  running = false;

  ustawStatus("Program zatrzymany przez użytkownika.");

  render();
}

function resetujGlowice() {
  inputHead = 0;
  output = [];

  render();
}

function resetujMaszyne() {
  pc = 0;
  inputHead = 0;
  output = [];

  memory = Array(LICZBA_REJESTROW).fill(null);

  running = false;

  ustawStatus("Maszyna zresetowana.");

  render();
}

function pobierzWierszeProgramu() {
  return $$("#program-body tr").map(row => ({
    label: row.cells[1].innerText.trim(),
    instruction: row.cells[2].querySelector("select").value.trim(),
    argument: row.cells[3].innerText.trim(),
    comment: row.cells[4].innerText.trim()
  }));
}

function pobierzTasmeWejsciowa() {
  return $$("#input-cells .komorka").map(cell =>
    cell.innerText.trim()
  );
}

function ustawTasmeWejsciowa(values = []) {
  const cells = $$("#input-cells .komorka");

  cells.forEach((cell, index) => {
    cell.innerText = values[index] || "";
  });
}

function render(program = pobierzProgram().program) {
  $$("#program-body tr").forEach(row =>
    row.classList.remove("current")
  );

  if (program[pc]) {
    program[pc].row.classList.add("current");
  }

  const current = program[pc];

  $("#pc-view").value = current
    ? String(current.line + 1)
    : String(pc + 1);

  $("#instruction-view").value = current
    ? current.instruction.toUpperCase()
    : "";

  $("#argument-view").value = current
    ? current.argument
    : "";

  const rows = $$("#memory-body tr");

  memory.forEach((value, index) => {
    rows[index].cells[1].innerText =
      value === null ? "" : value;

    rows[index].classList.toggle(
      "accumulator",
      index === 0
    );
  });

  renderInputTape();

  renderTape(
    "output-cells",
    output,
    output.length,
    "output-head"
  );
}

function inicjalizujTasmeWejsciowa() {
  const container = $("#input-cells");

  container.innerHTML = "";

  for (let i = 0; i < 7; i++) {
    const cell = document.createElement("div");

    cell.className = "komorka";
    cell.contentEditable = "true";
        cell.dataset.index = String(i);
        cell.addEventListener("input", resetujGlowice);
        container.appendChild(cell);
      }
    }
    function renderInputTape() {
      const cells = $$("#input-cells .komorka");
      const emptyIndex = cells.findIndex(cell => cell.innerText.trim() === "");
      const headIndex = emptyIndex === -1 ? cells.length - 1 : emptyIndex;
      cells.forEach((cell, index) => {
        cell.classList.toggle("head", index === headIndex);
      });
      ustawStrzalke("input-head", headIndex);
    }
    function renderTape(id, values, head, arrowId = null) {
      const container = $(`#${id}`);
      if (!container) return;
      container.innerHTML = "";
      const start = Math.max(0, head - 6);
      const visible = values.slice(start, start + 7);
      while (visible.length < 7) visible.push("");
      const headColumn = Math.min(Math.max(head - start, 0), 6);
      visible.forEach((value, index) => {
        const cell = document.createElement("div");
        cell.className = "komorka";
        cell.textContent = value;
        if (index === headColumn) cell.classList.add("head");
        container.appendChild(cell);
      });
      if (arrowId) ustawStrzalke(arrowId, headColumn);
    }
    function ustawStrzalke(id, index) {
      const arrow = $(`#${id}`);
      if (!arrow) return;
      arrow.style.gridColumn = `${index + 1}`;
    }
    function ustawStatus(text) {
      $("#status").innerText = text;
    }
    inicjalizujPamiec();
    inicjalizujTasmeWejsciowa();
    wyczyscProgram();
    resetujMaszyne();
      </script>
</body>
</html>
