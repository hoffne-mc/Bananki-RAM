<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>RAM Machine 2006</title>
  <link rel="stylesheet" href="styl.css" />
</head>
<body>
  
  <div class="okno">
     <div class="pasek-narzedzi"> 
      <div class="wrapper">
      <button class="przycisk-narzedzia" type="button" onclick="zapiszMaszyne()">📂</button>
      <div class="przycisk-narzedzia-tekst">Zapisz dane maszyny</div>
      </div>
      <div class="wrapper">
      <button class="przycisk-narzedzia" type="button" onclick="wczytajMaszyne()">📄</button>
      <div class="przycisk-narzedzia-tekst">Wczytaj zapisane dane</div>
      </div>
<input id="plik-zapisu" type="file" accept="application/json,.json" onchange="obsluzPlikZapisu(event)" hidden />
      <div class="separator"></div>
      <div class="wrapper">
      <button class="przycisk-narzedzia" type="button" onclick="uruchomProgram()">▶</button>
      <div class="przycisk-narzedzia-tekst">Uruchom program</div>
      </div>
      <div class="wrapper">
      <button class="przycisk-narzedzia" type="button" onclick="wykonajKrok()">⏭</button>
      <div class="przycisk-narzedzia-tekst">Wykonaj jeden krok</div>
      </div>  
      <div class="wrapper">
      <button class="przycisk-narzedzia" type="button" onclick="zatrzymajProgram()">⏺</button>
      <div class="przycisk-narzedzia-tekst">Zakończ program</div>
      </div>  
      <div class="wrapper">
      <button class="przycisk-narzedzia" type="button" onclick="resetujMaszyne()">↺</button>
      <div class="przycisk-narzedzia-tekst">Resetuj maszyne</div>
      </div>  
    </div>
<div class="glowny-uklad">
      <div class="panel procesor">
        <div class="naglowek-panelu">PROCESSOR </div>
        <div class="wiersz-procesora">
          <span class="etykieta">Instruction:</span>
          <input class="pole-tekstowe" type="text" readonly />
        </div>
        <div class="wiersz-procesora">
          <span class="etykieta">PC:</span>
          <input class="pole-tekstowe" type="text" readonly />
        </div>
      </div>
      <div class="panel tasma">
        <div class="tasma-blok">
          <div class="podpis-tasmy">INPUT</div>
          <div class="wiersz-strzalki">
            <span id="input-head" class="strzalka-glowicy">▼</span>
          </div>
          <div id="input-cels" class="komorki-tasmy input-edittable"></div>
          </div>
          <div class="tasma-blok">
            <div class="podpis-tasmy">OUTPUT</div>
            <div class="wiersz-strzalki">
              <span id="output-cells" class="komorki-tasmy">▼</span>
            </div>
            <div id="output-cells" class="komorki-tasmy"></div>
          </div>
          </div>
          
        
        <div class="komorki-tasmy">
          <div class="komorka"></div>
          <div class="komorka"></div>
          <div class="komorka"></div>
          <div class="komorka"></div>
          <div class="komorka"></div>
        </div>
        <div class="strzalka-glowicy">▲</div>
        <br>
      </div>
      <div class="panel pamiec">
        <div class="naglowek-panelu">MEMORY </div>
        <div class="przewijalna-tabela">
          <table id="btt">
            <thead>
              <tr>
                <th>Address</th>
                <th>Value</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>0</td><td></td></tr>
              <tr><td>1</td><td></td></tr>
              <tr><td>2</td><td></td></tr>
              <tr><td>3</td><td></td></tr>
              <tr><td>4</td><td></td></tr>
              <tr><td>5</td><td></td></tr>
              <tr><td>6</td><td></td></tr>
              <tr><td>7</td><td></td></tr>
              <tr><td>8</td><td></td></tr>
              <tr><td>9</td><td></td></tr>
              <tr><td>10</td><td></td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel program">
        <div class="naglowek-panelu">PROGRAM </div>
        <div class="przewijalna-tabela">
                  <table class="tabela-programu">
                      <thead>
                        <tr>
                          <th class="col-ln"></th>
                          <th class="col-lbl">Label</th>
                          <th class="col-ins">Instruction</th>
                          <th class="col-arg">Argument</th>
                          <th class="col-com">Comment</th>
                        </tr>
                      </thead>
                      <tbody id="program-body">
                        <tr>
                          <td class="ln">1.</td>
                          <td contenteditable="true"></td>
                          <td>
                            <select>
                              <option></option>
                              <option>add</option>
                              <option>div</option>
                              <option>halt</option>
                              <option>jgtz</option>
                              <option>jump</option>
                              <option>jzero</option>
                              <option>load</option>
                              <option>mult</option>
                              <option>read</option>
                              <option>store</option>
                              <option>sub</option>
                              <option>write</option>
                            </select>
                          </td>
                          <td contenteditable="true"></td>
                          <td contenteditable="true"></td>
                        </tr>
                      </tbody>
                    </table>
                <div class="kontrolki-programu">
                  <button id="but" onclick="dodajWiersz()">+</button>
                  <button id="bu" onclick="usunWiersz()">-</button>
                </div>
        </div>
      </div>
    </div>
  </div>
      <script>
        const INSTRUKCJE = ["", "add", "div", "halt", "jgtz", "jump", "jzero", "load", "mult", "read", "store", "sub", "write"],
        LICZBA_REJESTROW = 16,
        LIMIT_KROKOW = 10000;
        KLUCZ_ZAPISU = "ram-machine-zapis",
        CZAS_ANIMACJI = 1200,
        $ = (selector, root = document) => root.querySelector(selector),
        $$ = (selector, root = document) => [...root.querySelectorAll(selector)],
        pustaPamiec = () => Array(LICZBA_REJESTROW).fill(null);
        let pc = 0, inputHead = 0, output = [], memory = pustaPamiec(), running = false, animating = false;
            const tbody = document.getElementById("program-body");
            const rowCount = tbody.rows.length + 1;

            const row = tbody.insertRow();

            row.innerHTML = `
              <td class="ln">${rowCount}.</td>
              <td contenteditable="true"></td>
              <td>
                <select>
                  <option></option>
                  <option>add</option>
                  <option>div</option>
                  <option>halt</option>
                  <option>jgtz</option>
                  <option>jump</option>
                  <option>jzero</option>
                  <option>load</option>
                  <option>mult</option>
                  <option>read</option>
                  <option>store</option>
                  <option>sub</option>
                  <option>write</option>
                </select>
              </td>
              <td contenteditable="true"></td>
              <td contenteditable="true"></td>
            `;
          }

          function usunWiersz() {
            const tbody = document.getElementById("program-body");

            if (tbody.rows.length > 1) {
              tbody.deleteRow(tbody.rows.length - 1);
            } else {
              const row = tbody.rows[0];
              row.cells[1].innerText = "";
              row.cells[2].querySelector("select").value = "";
              row.cells[3].innerText = "";
              row.cells[4].innerText = "";
            }
          }

                  document.addEventListener("click", function(e) {
            const row = e.target.closest("tr");

            if (!row) return;
 
            
            if (row.classList.contains("aktywny")) {
              row.classList.remove("aktywny");
            } else {
             
              const rows = document.querySelectorAll("#program-body tr");
              rows.forEach(r => r.classList.remove("aktywny"));

              
              row.classList.add("aktywny");
            }
          });
          function przygotujZapis() {
            return {
              version: 1,
              savedAt: newDate().toISOString(),
              pc,
              inputHead,
              output,
              memory,
              input: pobierzTasmeWejsciowa(),
              program: pobierzWierszeProgramu()
            };
          }

          function wyczyscProgram() {
            const tbody = $("#program-body");
            tbody.innerHTML ="";
            dodajWiersz();
          }
          function komorkaPameci(index){
            const row = $$("#memory-body tr")[index];
            if (!row) return null;
            row.scrollIntoView({block: "nearest"});
            return row.cells[1];
          }
          function komorkaWejscia(index){
            return $$("#input-cells .komorka")[index] || null;
          }
          function wolnaKomorkaWyjscia(){
            return $("#output-cells .komorka.head") || $("#output-cells .komorka:last-child");
          }
          function elementDlaArgumentu(argument) {
            if (!argument) return komorkaPamieci(0);
            if (argument.startsWith("=")) return $("#argument-view");
            return komorkaPamieci(adres(argument));
          }
          async function animujOperacje(cmd,znak, operand){
            const accumulator = wymaganaWartoscRejestru(0,cmd.instruction);
            await animujPrzeplyw({
              from: elementDlaArgumentu(cmd.argument),
              to: komorkaPameci(0),
              value: operand,
              label: `${accumulator} ${znak} ${operand}`
            });
          }
            
          
      </script>
</body>
</html>
